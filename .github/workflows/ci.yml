# Rosenweg-CI: bauen, Unit-Tests, Android-Lint und detekt bei jedem PR auf main und bei jedem
# Push auf main. Ersetzt die von Fossify geerbten Aufrufe (FossifyOrg/.github, pr.yml usw.).
# Die Rosenweg-Bibliotheken kommen aus GitHub Packages (siehe .github/actions/vorbereiten).
# Lint und detekt laufen mit den Baselines im Repo; neue Funde sind echte Funde.
# Fuer Branch-Schutz genuegt der Check "CI / ci-gate".
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BAUEN: ":app:assembleFossDebug"
  TESTEN: ":app:testFossDebugUnitTest"
  LINT: ":app:lintFossDebug"

jobs:
  # Runner-Wahl (Rosenweg/rosenweg-basis, runner-wahl.yml): privat immer eigene,
  # oeffentlich eigene wenn frei oder zuschaltbar, Forks nie. macOS bleibt bei GitHub.
  wahl:
    uses: Rosenweg/rosenweg-basis/.github/workflows/runner-wahl.yml@main
    secrets:
      PAKETE_APP_ID: ${{ secrets.PAKETE_APP_ID }}
      PAKETE_APP_KEY: ${{ secrets.PAKETE_APP_KEY }}

  changes:
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: wahl
    outputs:
      run_ci: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!fastlane/**'
              - '!graphics/**'
              - '!LICENSE'

  wrapper-validation:
    needs: [changes, wahl]
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6

  build:
    name: build + test
    needs: [changes, wrapper-validation, wahl]
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/vorbereiten
      - name: Bauen
        run: ./gradlew $BAUEN
      - name: Unit-Tests
        run: ./gradlew --continue $TESTEN
      - name: Testberichte
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ failure() }}
        with:
          name: test-berichte
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  lint:
    needs: [changes, wrapper-validation, wahl]
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/vorbereiten
      - name: Android-Lint
        run: ./gradlew --continue $LINT
      - name: Lint-Berichte
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: lint-berichte
          path: "**/build/reports/lint-results-*.*"
          if-no-files-found: ignore

  detekt:
    needs: [changes, wrapper-validation, wahl]
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/vorbereiten
      - name: detekt
        id: detekt
        run: ./gradlew --continue detekt
      # Bei neuen Funden: Vorschlag fuer eine neue Baseline als Artefakt (nur uebernehmen, wenn
      # die Funde wirklich bewusst hingenommen werden; sonst den Code richten).
      - name: detekt-Baseline-Vorschlag
        if: ${{ failure() && steps.detekt.conclusion == 'failure' }}
        run: ./gradlew --continue detektBaseline
      - name: detekt-Berichte
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ failure() }}
        with:
          name: detekt-berichte
          path: |
            **/build/reports/detekt/
            **/detekt-baseline.xml
          if-no-files-found: ignore

  ci-gate:
    if: always()
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: [changes, wrapper-validation, build, lint, detekt, wahl]
    steps:
      - name: Alle Pruefungen gruen?
        run: |
          echo "run_ci: ${{ needs.changes.outputs.run_ci }}"
          echo "wrapper-validation: ${{ needs.wrapper-validation.result }}"
          echo "build + test: ${{ needs.build.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "detekt: ${{ needs.detekt.result }}"
          [[ "${{ needs.changes.result }}" == "success" ]] || exit 1
          [[ "${{ needs.changes.outputs.run_ci }}" == "true" ]] || { echo "Nur Doku geaendert, nichts zu bauen."; exit 0; }
          for r in "${{ needs.wrapper-validation.result }}" "${{ needs.build.result }}" "${{ needs.lint.result }}" "${{ needs.detekt.result }}"; do
            [[ "$r" == "success" ]] || exit 1
          done
